version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'yearly'
    commit-message:
      prefix: '[Dependabot]'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 10
    reviewers:
      - 'AdityaBhattacharya1'
    versioning-strategy: 'increase-if-necessary'
